<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Clientes</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
	<nav class="mb-4">
		<a class="btn btn-outline-primary" th:href="@{/clientes}">Clientes</a>
		<a class="btn btn-outline-secondary" th:href="@{/comerciales}">Comerciales</a>
	</nav>
	<div class="row align-items-center border-bottom pb-3 mb-3">
		<div class="col-md-8"><h1 class="mb-0">Clientes</h1></div>
		<div class="col-md-4 text-md-end mt-3 mt-md-0">
			<a class="btn btn-primary" th:href="@{/clientes/crear}">Crear cliente</a>
		</div>
	</div>
	<div class="row fw-bold border-bottom py-2 d-none d-lg-flex">
		<div class="col-lg-1">ID</div>
		<div class="col-lg-2">Nombre</div>
		<div class="col-lg-2">Apellido 1</div>
		<div class="col-lg-2">Apellido 2</div>
		<div class="col-lg-2">Ciudad</div>
		<div class="col-lg-1">Categoria</div>
		<div class="col-lg-2 text-center">Acciones</div>
	</div>
	<div class="row border-bottom py-3 align-items-center g-2" th:each="cliente : ${listaClientes}">
		<div class="col-6 col-lg-1"><span class="fw-bold d-lg-none">ID: </span><span th:text="${cliente.id}">1</span></div>
		<div class="col-6 col-lg-2"><span class="fw-bold d-lg-none">Nombre: </span><span th:text="${cliente.nombre}">Nombre</span></div>
		<div class="col-6 col-lg-2"><span class="fw-bold d-lg-none">Apellido 1: </span><span th:text="${cliente.apellido1}">Apellido</span></div>
		<div class="col-6 col-lg-2"><span class="fw-bold d-lg-none">Apellido 2: </span><span th:text="${cliente.apellido2}">Apellido</span></div>
		<div class="col-6 col-lg-2"><span class="fw-bold d-lg-none">Ciudad: </span><span th:text="${cliente.ciudad}">Ciudad</span></div>
		<div class="col-6 col-lg-1"><span class="fw-bold d-lg-none">Categoria: </span><span th:text="${cliente.categoria}">1</span></div>
		<div class="col-12 col-lg-2 d-flex flex-wrap justify-content-lg-center gap-1">
			<a class="btn btn-sm btn-success" th:href="@{/clientes/{id}(id=${cliente.id})}">Detalle</a>
			<a class="btn btn-sm btn-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
			<form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post">
				<button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
			</form>
		</div>
	</div>
</main>
</body>
</html>
