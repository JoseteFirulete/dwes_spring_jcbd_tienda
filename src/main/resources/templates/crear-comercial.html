<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Crear comercial</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
	<form th:action="@{/comerciales/crear}" th:object="${comercial}" method="post">
		<div class="row align-items-center border-bottom pb-3 mb-3">
			<div class="col-md-8"><h1>Crear comercial</h1></div>
			<div class="col-md-4 d-flex gap-2 justify-content-md-end">
				<a class="btn btn-secondary" th:href="@{/comerciales}">Volver</a>
				<button class="btn btn-primary" type="submit">Guardar</button>
			</div>
		</div>
		<div class="row g-3">
			<div class="col-md-6"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" th:field="*{nombre}" required></div>
			<div class="col-md-6"><label class="form-label" for="apellido1">Apellido 1</label><input class="form-control" id="apellido1" th:field="*{apellido1}" required></div>
			<div class="col-md-6"><label class="form-label" for="apellido2">Apellido 2</label><input class="form-control" id="apellido2" th:field="*{apellido2}"></div>
			<div class="col-md-6"><label class="form-label" for="comision">Comision</label><input class="form-control" id="comision" type="number" min="0" step="any" th:field="*{comision}" required></div>
		</div>
	</form>
</main>
</body>
</html>
