<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Detalle comercial</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
	<div class="row align-items-center border-bottom pb-3 mb-3">
		<div class="col-md-8"><h1>Detalle comercial</h1></div>
		<div class="col-md-4 text-md-end"><a class="btn btn-secondary" th:href="@{/comerciales}">Volver</a></div>
	</div>
	<div class="row g-3">
		<div class="col-md-6"><label class="form-label">ID</label><input class="form-control" th:value="${comercial.id}" readonly></div>
		<div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" th:value="${comercial.nombre}" readonly></div>
		<div class="col-md-6"><label class="form-label">Apellido 1</label><input class="form-control" th:value="${comercial.apellido1}" readonly></div>
		<div class="col-md-6"><label class="form-label">Apellido 2</label><input class="form-control" th:value="${comercial.apellido2}" readonly></div>
		<div class="col-md-6"><label class="form-label">Comision</label><input class="form-control" th:value="${comercial.comision}" readonly></div>
	</div>
</main>
</body>
</html>
