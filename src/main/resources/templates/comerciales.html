<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comerciales</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
	<nav class="mb-4">
		<a class="btn btn-outline-secondary" th:href="@{/clientes}">Clientes</a>
		<a class="btn btn-outline-primary" th:href="@{/comerciales}">Comerciales</a>
	</nav>
	<div class="row align-items-center border-bottom pb-3 mb-3">
		<div class="col-md-8"><h1 class="mb-0">Comerciales</h1></div>
		<div class="col-md-4 text-md-end mt-3 mt-md-0">
			<a class="btn btn-primary" th:href="@{/comerciales/crear}">Crear comercial</a>
		</div>
	</div>
	<div class="row fw-bold border-bottom py-2 d-none d-md-flex">
		<div class="col-md-1">ID</div>
		<div class="col-md-2">Nombre</div>
		<div class="col-md-2">Apellido 1</div>
		<div class="col-md-2">Apellido 2</div>
		<div class="col-md-2">Comision</div>
		<div class="col-md-3 text-center">Acciones</div>
	</div>
	<div class="row border-bottom py-3 align-items-center g-2" th:each="comercial : ${listaComerciales}">
		<div class="col-6 col-md-1"><span class="fw-bold d-md-none">ID: </span><span th:text="${comercial.id}">1</span></div>
		<div class="col-6 col-md-2"><span class="fw-bold d-md-none">Nombre: </span><span th:text="${comercial.nombre}">Nombre</span></div>
		<div class="col-6 col-md-2"><span class="fw-bold d-md-none">Apellido 1: </span><span th:text="${comercial.apellido1}">Apellido</span></div>
		<div class="col-6 col-md-2"><span class="fw-bold d-md-none">Apellido 2: </span><span th:text="${comercial.apellido2}">Apellido</span></div>
		<div class="col-6 col-md-2"><span class="fw-bold d-md-none">Comision: </span><span th:text="${comercial.comision}">0.0</span></div>
		<div class="col-12 col-md-3 d-flex flex-wrap justify-content-md-center gap-1">
			<a class="btn btn-sm btn-success" th:href="@{/comerciales/{id}(id=${comercial.id})}">Detalle</a>
			<a class="btn btn-sm btn-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
			<form th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="post">
				<button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
			</form>
		</div>
	</div>
</main>
</body>
</html>
